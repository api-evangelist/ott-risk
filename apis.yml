description: OTT Risk is a UK- and US-based insurtech Managing General Agent (MGA) building
  parametric, non-damage business interruption (NDBI) insurance for the digital economy.
  Its revenue-protection cover targets online marketplaces, gig and freelance workers, and
  enterprises, paying out against economic indices and industry metrics rather than physical-damage
  claims. OTT Risk is a portfolio company of Anthemis and an alumnus of the Lloyd's Lab
  Accelerator (Cohort 9, 2022), with underwriting capacity from Apollo ibott Syndicate 1971.
  As of this enrichment pass the company publishes no public developer portal, documentation,
  or API surface, and its former ottrisk.com domain now resolves to a domain-sale page,
  indicating the company may be dormant.
